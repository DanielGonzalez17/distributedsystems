server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    resolver 10.43.0.10 valid=10s;

    location = /catalog.js {
        alias /usr/share/nginx/catalog.js;
    }

    location = /catalog.css {
        alias /usr/share/nginx/catalog.css;
    }

    location /api/ {
        set $backend "http://store-api.store.svc.cluster.local:8080";
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Presentation-LB "k3s-traefik";
        proxy_set_header X-Web-Node $hostname;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}