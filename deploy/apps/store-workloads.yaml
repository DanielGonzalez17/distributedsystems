apiVersion: apps/v1
kind: Deployment
metadata:
  name: store-api
  namespace: store
spec:
  replicas: 2
  selector:
    matchLabels:
      app: store-api
  template:
    metadata:
      labels:
        app: store-api
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: store-api
          image: ghcr.io/danielgonzalez17/store-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: store-secrets
          env:
            - name: APPLICATION_NODE
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
---
apiVersion: v1
kind: Service
metadata:
  name: store-api
  namespace: store
spec:
  selector:
    app: store-api
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: store-worker
  namespace: store
spec:
  replicas: 2
  selector:
    matchLabels:
      app: store-worker
  template:
    metadata:
      labels:
        app: store-worker
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: store-worker
          image: ghcr.io/danielgonzalez17/store-worker:latest
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: store-secrets
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: store-web
  namespace: store
spec:
  replicas: 2
  selector:
    matchLabels:
      app: store-web
  template:
    metadata:
      labels:
        app: store-web
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: store-web
          image: ghcr.io/danielgonzalez17/store-web:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: store-web
  namespace: store
spec:
  type: NodePort
  selector:
    app: store-web
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
