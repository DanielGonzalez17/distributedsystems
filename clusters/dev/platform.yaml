apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-data
  namespace: flux-system
spec:
  interval: 2m
  path: ./deploy/platform/data
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-rabbitmq
  namespace: flux-system
spec:
  dependsOn:
    - name: platform-data
  interval: 2m
  path: ./deploy/platform/rabbitmq
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
